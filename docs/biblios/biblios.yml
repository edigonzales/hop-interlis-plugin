site:
  title: "hop-interlis-plugin: Benutzerhandbuch"
  url: https://github.com/edigonzales/hop-interlis-plugin
  default_language: de

output:
  dir: build/docs-site
  clean: true

ui:
  theme: default
  show_version_badge: false
  show_edit_link: true
  show_source_link: true
  syntax_highlighting: prism
  version_switch_mode: start_page
  search_language_mode: multilingual_safe
  sidebar_toc_depth: 2
  content_toc: off
  content_section_numbers: on
  content_section_number_depth: 3

content:
  sources:
    - id: benutzerhandbuch
      display_name: Benutzerhandbuch
      card_label: Benutzer
      url: file:///Users/stefan/sources/hop-interlis-plugin
      branches:
        - name: main
          display_version: Aktuell
      start_path: docs/biblios/user
      default_version: main
      render_mode: single_page
      master_file: master.adoc
      sidebar_toc_numbers: on

pdf:
  enabled: true
  attributes:
    source-highlighter: rouge
    rouge-style: github
    pdf-theme: default
    toc: true
    sectnums: true
    chapter-signifier: false

docx:
  enabled: false
