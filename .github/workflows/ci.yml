name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Check out hop-geometry-type-plugin
        uses: actions/checkout@v4
        with:
          repository: edigonzales/hop-geometry-type-plugin
          path: ../hop-geometry-type-plugin

      - name: Build and install hop-geometry-type-plugin
        run: mvn -B -ntp -f ../hop-geometry-type-plugin/pom.xml clean install

      - name: Build and verify
        run: mvn -B -ntp clean verify

      - name: Check plugin distribution
        run: python scripts/check-distribution.py

      - name: Upload plugin distribution
        uses: actions/upload-artifact@v4
        with:
          name: hop-interlis-plugin-${{ matrix.os }}
          path: assemblies/assemblies-hop-interlis/target/hop-interlis-plugin-*.zip
