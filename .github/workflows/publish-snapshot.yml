name: Publish Maven snapshot

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
  publish:
    needs: verify
    uses: edigonzales/hop-plugin-ci/.github/workflows/plugin-publish.yml@5426b1aa9ad67f5e799822abaafb89e29f47b469
    with:
      ci-ref: 5426b1aa9ad67f5e799822abaafb89e29f47b469
      repository-kind: snapshot
      verified-artifact-name: hop-interlis-plugin-canonical
      pom-file: assemblies/assemblies-hop-interlis/pom.xml
      artifact-id: hop-interlis-plugin
      plugin-root: plugins/transforms/interlis
    secrets:
      MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
      MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
