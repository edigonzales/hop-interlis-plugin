name: Verify plugin

on:
  workflow_call:

permissions:
  contents: read

jobs:
  geometry:
    runs-on: ubuntu-latest
    outputs:
      resolved_version: ${{ steps.snapshot.outputs.resolved_version }}
      zip_name: ${{ steps.snapshot.outputs.zip_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: edigonzales/hop-plugin-ci
          ref: e3985b7ab27d22cc63d9d9bf206d0ffdd118c38e
          path: .ci/hop-plugin-ci
          persist-credentials: false
      - name: Test snapshot resolution
        run: python3 -B -m unittest discover -s .ci/hop-plugin-ci/tests -v
      - name: Resolve published geometry snapshot
        id: snapshot
        run: |
          mkdir -p .ci/geometry-dist
          python3 .ci/hop-plugin-ci/scripts/resolve_maven_snapshot.py \
            --group ch.so.agi \
            --artifact hop-geometry-type-plugin \
            --version 0.2.0-SNAPSHOT \
            --output .ci/geometry-dist/hop-geometry-type-plugin-0.2.0-SNAPSHOT.zip \
            --github-output "$GITHUB_OUTPUT"
          grep '^resolved_version=' "$GITHUB_OUTPUT" | tail -n 1 | cut -d= -f2- > .ci/geometry-dist/resolved-version.txt
      - uses: actions/upload-artifact@v4
        with:
          name: geometry-runtime
          path: .ci/geometry-dist/*
          if-no-files-found: error

  build:
    needs: geometry
    uses: edigonzales/hop-plugin-ci/.github/workflows/plugin-verify.yml@e3985b7ab27d22cc63d9d9bf206d0ffdd118c38e
    with:
      ci-ref: e3985b7ab27d22cc63d9d9bf206d0ffdd118c38e
      java-versions: '["21", "25"]'
      runner-os: '["ubuntu-latest", "macos-15", "windows-latest"]'
      canonical-runner-os: ubuntu-latest
      canonical-java-version: '21'
      maven-working-directory: .
      maven-options: -U -B -ntp
      compatibility-goals: test
      maven-extra-args: -Dhop.geometry.type.version=${{ needs.geometry.outputs.resolved_version }}
      dependency-install: true
      dependency-group-id: ch.so.agi
      dependency-artifact-id: hop-geometry-type
      dependency-version: ${{ needs.geometry.outputs.resolved_version }}
      dependency-jar-glob: plugins/misc/hop-geometry-type/*.jar
      maven-goals: clean verify
      pom-file: assemblies/assemblies-hop-interlis/pom.xml
      zip-glob: assemblies/assemblies-hop-interlis/target/hop-interlis-plugin-*.zip
      validation-commands: '["python scripts/check-distribution.py"]'
      dependency-artifact-name: geometry-runtime
      dependency-artifact-path: .ci/geometry-dist
      artifact-name-prefix: hop-interlis-plugin
      group-id: ch.so.agi
      artifact-id: hop-interlis-plugin
      hop-version: 2.19.0
      plugin-root: plugins/transforms/interlis

  installed-e2e:
    needs: [geometry, build]
    runs-on: ubuntu-latest
    env:
      GEOMETRY_VERSION: ${{ needs.geometry.outputs.resolved_version }}
      GEOMETRY_ZIP_NAME: ${{ needs.geometry.outputs.zip_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: edigonzales/hop-plugin-ci
          ref: e3985b7ab27d22cc63d9d9bf206d0ffdd118c38e
          path: .ci/hop-plugin-ci
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: hop-interlis-plugin-canonical
          path: assemblies/assemblies-hop-interlis/target
      - uses: actions/download-artifact@v4
        with:
          name: geometry-runtime
          path: .ci/geometry-dist
      - name: Resolve compatible Vector/Raster snapshot
        run: |
          mkdir -p .ci/vector-raster-dist
          python3 .ci/hop-plugin-ci/scripts/resolve_maven_snapshot.py \
            --group ch.so.agi \
            --artifact hop-vector-raster-plugin \
            --version 0.1.0-SNAPSHOT \
            --output .ci/vector-raster-dist/hop-vector-raster-plugin-0.1.0-SNAPSHOT.zip
      - name: Download isolated Hop 2.19.0
        run: |
          if ! curl --fail --location --retry 3 --connect-timeout 20 --max-time 600 \
            https://downloads.apache.org/hop/2.19.0/apache-hop-client-2.19.0.zip -o "$RUNNER_TEMP/hop.zip"; then
            curl --fail --location --retry 3 --connect-timeout 20 --max-time 600 \
              https://archive.apache.org/dist/hop/2.19.0/apache-hop-client-2.19.0.zip -o "$RUNNER_TEMP/hop.zip"
          fi
          echo "eb227ffe3386480f5ecb59e1d9fdbb16ace15b9ebd9e02da16cdca2c3cadc869f92275b0f607952fb2c5122986839a5b09b2c5762401dad128d8de6b0394643c  $RUNNER_TEMP/hop.zip" | sha512sum -c -
      - name: Install isolated Hop 2.19.0 and run suite
        run: |
          unzip -q "$RUNNER_TEMP/hop.zip" -d "$RUNNER_TEMP/isolated-hop"
          export HOP_GEOMETRY_TYPE_ZIP="$PWD/.ci/geometry-dist/$GEOMETRY_ZIP_NAME"
          vector_raster_zip="$(find "$PWD/.ci/vector-raster-dist" -maxdepth 1 -name 'hop-vector-raster-plugin-*.zip' -print | head -n 1)"
          export HOP_VECTOR_RASTER_ZIP="$vector_raster_zip"
          export REQUIRE_VECTOR_RASTER_E2E=true
          bash scripts/run-e2e.sh "$RUNNER_TEMP/isolated-hop/hop"
