name: Verify plugin
on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        jdk: ['21', '25']
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}
      - uses: actions/checkout@v4
        with:
          repository: edigonzales/hop-geometry-type-plugin
          ref: dd20a01ea68d85a3602b2edf2db810b42506aa4d
          path: .ci/geometry
      - name: Build tested geometry dependency
        run: mvn -B -ntp -f .ci/geometry/pom.xml clean install
      - name: Build and verify
        run: ./mvnw -B -ntp clean verify
      - name: Check distribution
        run: python scripts/check-distribution.py
      - uses: actions/upload-artifact@v4
        with:
          name: hop-interlis-plugin-${{ matrix.os }}-jdk${{ matrix.jdk }}
          path: assemblies/assemblies-hop-interlis/target/hop-interlis-plugin-*.zip
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest' && matrix.jdk == '21'
        with:
          name: geometry-runtime
          path: .ci/geometry/assemblies/assemblies-hop-geometry-type/target/hop-geometry-type-plugin-*.zip

  packaged-e2e:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: hop-interlis-plugin-ubuntu-latest-jdk21
          path: assemblies/assemblies-hop-interlis/target
      - uses: actions/download-artifact@v4
        with:
          name: geometry-runtime
          path: .ci/geometry-dist
      - uses: actions/checkout@v4
        with:
          repository: edigonzales/hop-geometry-type-plugin
          ref: dd20a01ea68d85a3602b2edf2db810b42506aa4d
          path: .ci/geometry
      - uses: actions/checkout@v4
        with:
          repository: edigonzales/hop-geotools-plugin
          ref: 578cacc6eb6e34657d1823f5f88036e7f8751144
          path: .ci/geotools
      - name: Build compatible GeoTools test dependency
        run: |
          mvn -B -ntp -f .ci/geometry/pom.xml clean install
          mvn -B -ntp -f .ci/geotools/pom.xml -Dhop.version=2.18.1 -Dhop.geometry.type.version=0.2.0-SNAPSHOT clean verify
      - name: Install isolated Hop 2.18.1 and run packaged suite
        run: |
          curl --fail --location --retry 3 https://archive.apache.org/dist/hop/2.18.1/apache-hop-client-2.18.1.zip -o "$RUNNER_TEMP/hop.zip"
          unzip -q "$RUNNER_TEMP/hop.zip" -d "$RUNNER_TEMP/isolated-hop"
          export HOP_GEOMETRY_TYPE_ZIP="$PWD/.ci/geometry-dist/hop-geometry-type-plugin-0.2.0-SNAPSHOT.zip"
          export HOP_GEOTOOLS_ZIP="$PWD/.ci/geotools/assemblies/assemblies-hop-geotools/target/hop-geotools-plugin-0.1.0-SNAPSHOT.zip"
          export REQUIRE_GEOTOOLS_E2E=true
          bash scripts/run-e2e.sh "$RUNNER_TEMP/isolated-hop/hop"
