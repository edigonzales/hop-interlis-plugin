name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  verify:
    uses: ./.github/workflows/verify.yml
  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hop-interlis-plugin-ubuntu-latest-jdk21
          path: distribution
      - uses: softprops/action-gh-release@v2
        with:
          files: distribution/hop-interlis-plugin-*.zip
          generate_release_notes: true
