name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  verify:
    uses: ./.github/workflows/verify.yml
  publish:
    needs: verify
    uses: edigonzales/hop-plugin-ci/.github/workflows/plugin-publish.yml@3f062b8e0a6c9c744dc0cf3e447578d6353f8ff1
    with:
      ci-ref: 3f062b8e0a6c9c744dc0cf3e447578d6353f8ff1
      repository-kind: release
      verified-artifact-name: hop-interlis-plugin-ubuntu-latest-jdk21
      pom-file: assemblies/assemblies-hop-interlis/pom.xml
      artifact-id: hop-interlis-plugin
      plugin-root: plugins/transforms/interlis
    secrets:
      MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
      MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
