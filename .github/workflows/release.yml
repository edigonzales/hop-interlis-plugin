name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  verify:
    uses: ./.github/workflows/verify.yml
  publish:
    needs: verify
    uses: edigonzales/hop-plugin-ci/.github/workflows/plugin-publish.yml@990af4813013fa8d21f6447e7545ed5499f2f202
    with:
      ci-ref: 990af4813013fa8d21f6447e7545ed5499f2f202
      repository-kind: release
      verified-artifact-name: hop-interlis-plugin-canonical
      pom-file: assemblies/assemblies-hop-interlis/pom.xml
      artifact-id: hop-interlis-plugin
      plugin-root: plugins/transforms/interlis
      extra-maven-artifacts: '[{"file":".ci/publish/pom.xml","pom-file":".ci/publish/pom.xml","packaging":"pom"}]'
    secrets:
      MAVEN_USERNAME: ${{ secrets.INTERLIS_MAVEN_USERNAME }}
      MAVEN_PASSWORD: ${{ secrets.INTERLIS_MAVEN_TOKEN }}
