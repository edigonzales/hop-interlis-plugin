name: Release

# Automated release process: on a version tag (e.g. v1.0.0), build the plugin
# distribution and attach it to the GitHub release for the tag.
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Check out hop-geometry-type-plugin
        uses: actions/checkout@v4
        with:
          repository: edigonzales/hop-geometry-type-plugin
          path: ../hop-geometry-type-plugin

      - name: Build and install hop-geometry-type-plugin
        run: mvn -B -ntp -f ../hop-geometry-type-plugin/pom.xml clean install

      - name: Build and verify
        run: mvn -B -ntp clean verify

      - name: Check plugin distribution
        run: python scripts/check-distribution.py

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: assemblies/assemblies-hop-interlis/target/hop-interlis-plugin-*.zip
          generate_release_notes: true
