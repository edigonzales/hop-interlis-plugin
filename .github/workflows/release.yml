name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  verify:
    uses: ./.github/workflows/verify.yml
  publish:
    needs: verify
    uses: edigonzales/hop-plugin-ci/.github/workflows/plugin-publish.yml@51aa132e7dccb385f1c8687fda1e83817e9f731b
    with:
      ci-ref: 51aa132e7dccb385f1c8687fda1e83817e9f731b
      repository-kind: release
      verified-artifact-name: hop-interlis-plugin-canonical
      pom-file: assemblies/assemblies-hop-interlis/pom.xml
      artifact-id: hop-interlis-plugin
      plugin-root: plugins/transforms/interlis
    secrets:
      MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
      MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
