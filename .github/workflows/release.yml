name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  verify:
    uses: ./.github/workflows/verify.yml
  publish:
    needs: verify
    uses: edigonzales/hop-plugin-ci/.github/workflows/plugin-publish.yml@661af245b23538192b467758e337216a9f96459e
    with:
      ci-ref: 661af245b23538192b467758e337216a9f96459e
      repository-kind: release
      verified-artifact-name: hop-interlis-plugin-ubuntu-latest-jdk21
      pom-file: assemblies/assemblies-hop-interlis/pom.xml
      artifact-id: hop-interlis-plugin
      plugin-root: plugins/transforms/interlis
    secrets:
      MAVEN_USERNAME: ${{ secrets.INTERLIS_MAVEN_USERNAME }}
      MAVEN_PASSWORD: ${{ secrets.INTERLIS_MAVEN_TOKEN }}
